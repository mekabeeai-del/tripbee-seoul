<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beaty Agent - Debug Console</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #0f0f1a;
            color: #eee;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 좌측: 채팅 패널 */
        .chat-panel {
            width: 380px;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            border-right: 1px solid #333;
        }

        .chat-header {
            padding: 16px 20px;
            background: #16213e;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #27ae60;
            border-radius: 50%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .message {
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            display: flex;
            justify-content: flex-end;
        }

        .message-user .bubble {
            background: #4a69bd;
            color: white;
            padding: 10px 14px;
            border-radius: 16px 16px 4px 16px;
            max-width: 85%;
            font-size: 0.95rem;
        }

        .message-assistant {
            display: flex;
            gap: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #f6b93b, #e55039);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .message-assistant .bubble {
            background: #2d3748;
            padding: 10px 14px;
            border-radius: 4px 16px 16px 16px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .chat-input {
            padding: 16px;
            background: #16213e;
            border-top: 1px solid #333;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 20px;
            background: #2d3748;
            color: #eee;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input input:focus {
            box-shadow: 0 0 0 2px #4a69bd;
        }

        .chat-input button {
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            background: #4a69bd;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-input button:hover { background: #3c5aa6; }
        .chat-input button:disabled { background: #555; cursor: not-allowed; }

        /* 중앙: 지도 */
        .map-panel {
            flex: 1;
            position: relative;
        }

        #map { width: 100%; height: 100%; }

        .map-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(26, 26, 46, 0.9);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .map-overlay .coords {
            color: #888;
            font-family: monospace;
        }

        /* 우측: 디버그 패널 */
        .debug-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: #0d0d14;
            border-left: 1px solid #333;
        }

        .debug-header {
            padding: 16px 20px;
            background: #16213e;
            border-bottom: 1px solid #333;
        }

        .debug-header h2 {
            font-size: 1rem;
            color: #aaa;
            font-weight: 500;
        }

        .debug-tabs {
            display: flex;
            border-bottom: 1px solid #333;
            background: #1a1a2e;
        }

        .debug-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .debug-tab.active {
            color: #4a69bd;
            border-bottom-color: #4a69bd;
        }

        .debug-tab:hover { color: #eee; }

        .debug-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .debug-section { display: none; }
        .debug-section.active { display: block; }

        /* 도구 카드 */
        .tool-card {
            background: #1e1e2e;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .tool-header {
            padding: 10px 14px;
            background: #252538;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .tool-name { color: #f6b93b; font-weight: 500; }

        .tool-status {
            margin-left: auto;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .tool-status.success { background: #27ae60; }
        .tool-status.pending { background: #f39c12; }
        .tool-status.error { background: #e74c3c; }

        .tool-body { padding: 10px 14px; }

        .tool-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .tool-json {
            background: #0a0a12;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: #7ec8e3;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        /* 데이터 카드 */
        .data-card {
            background: #1e1e2e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }

        .data-title {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-count {
            font-size: 0.75rem;
            background: #4a69bd;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .poi-item {
            background: #252538;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .poi-item:hover {
            background: #303050;
        }

        .poi-item:last-child { margin-bottom: 0; }
        .poi-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 2px; }
        .poi-addr { font-size: 0.8rem; color: #888; }

        .raw-json {
            background: #0a0a12;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            color: #7ec8e3;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 30px;
        }

        .empty-state .icon { font-size: 2rem; margin-bottom: 10px; }

        /* 로딩 */
        .loading {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background: #4a69bd;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 채팅 패널 -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="status-dot"></div>
                <h1>🐝 Beaty Agent</h1>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message message-assistant">
                    <div class="avatar">🐝</div>
                    <div class="bubble">
                        안녕! 나는 Beaty야.<br>서울 여행에 대해 물어봐! 🗺️
                    </div>
                </div>
            </div>
            <div class="chat-input">
                <div class="input-wrapper">
                    <input type="text" id="queryInput" placeholder="메시지 입력..." />
                    <button id="sendBtn" onclick="sendMessage()">전송</button>
                </div>
            </div>
        </div>

        <!-- 지도 패널 -->
        <div class="map-panel">
            <div id="map"></div>
            <div class="map-overlay">
                <div>📍 지도 클릭으로 위치 설정</div>
                <div class="coords" id="coordsDisplay">37.5665, 126.9780</div>
            </div>
        </div>

        <!-- 디버그 패널 -->
        <div class="debug-panel">
            <div class="debug-header">
                <h2>🔍 Response Inspector</h2>
            </div>
            <div class="debug-tabs">
                <button class="debug-tab active" onclick="switchTab('tools')">🔧 Tools</button>
                <button class="debug-tab" onclick="switchTab('data')">📦 Data</button>
                <button class="debug-tab" onclick="switchTab('raw')">{ } Raw</button>
            </div>
            <div class="debug-content">
                <div class="debug-section active" id="toolsSection">
                    <div class="empty-state" id="toolsEmpty">
                        <div class="icon">🔧</div>
                        <p>도구 호출 정보가 표시됩니다</p>
                    </div>
                    <div id="toolsList"></div>
                </div>
                <div class="debug-section" id="dataSection">
                    <div class="empty-state" id="dataEmpty">
                        <div class="icon">📦</div>
                        <p>POI, 경로 데이터가 표시됩니다</p>
                    </div>
                    <div id="dataList"></div>
                </div>
                <div class="debug-section" id="rawSection">
                    <div class="raw-json" id="rawJson">// 응답 데이터</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mapbox 초기화
        mapboxgl.accessToken = 'pk.eyJ1IjoieWVhaGhhIiwiYSI6ImNtZTk4bTY2czBvcjUya29pc2NmdzM2aDQifQ.Nv8VEnrxJ5BDqBDOHH518Q';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [126.9780, 37.5665],
            zoom: 12
        });

        // 상태
        let userLocation = { lat: 37.5665, lng: 126.9780 };
        let userLocationMarker = null;
        let allEvents = [];
        let poiMarkers = [];

        // DOM 요소
        const chatMessages = document.getElementById('chatMessages');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const toolsList = document.getElementById('toolsList');
        const toolsEmpty = document.getElementById('toolsEmpty');
        const dataList = document.getElementById('dataList');
        const dataEmpty = document.getElementById('dataEmpty');
        const rawJson = document.getElementById('rawJson');
        const coordsDisplay = document.getElementById('coordsDisplay');

        // 지도 클릭 이벤트
        map.on('click', (e) => {
            const { lng, lat } = e.lngLat;
            userLocation = { lat, lng };
            coordsDisplay.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;

            if (userLocationMarker) userLocationMarker.remove();

            const el = document.createElement('div');
            el.style.cssText = 'width:24px;height:24px;background:#4a69bd;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);';

            userLocationMarker = new mapboxgl.Marker(el)
                .setLngLat([lng, lat])
                .addTo(map);
        });

        // 키보드 이벤트
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        // 탭 전환
        function switchTab(tab) {
            document.querySelectorAll('.debug-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.debug-section').forEach(s => s.classList.remove('active'));
            document.querySelector(`.debug-tab[onclick*="${tab}"]`).classList.add('active');
            document.getElementById(`${tab}Section`).classList.add('active');
        }

        // 메시지 전송
        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query) return;

            // 초기화
            allEvents = [];
            toolsList.innerHTML = '';
            dataList.innerHTML = '';
            toolsEmpty.style.display = 'block';
            dataEmpty.style.display = 'block';
            rawJson.textContent = '// 로딩 중...';
            clearMapMarkers();

            // 사용자 메시지
            chatMessages.innerHTML += `
                <div class="message message-user">
                    <div class="bubble">${escapeHtml(query)}</div>
                </div>
            `;

            // 로딩
            const loadingId = 'loading-' + Date.now();
            chatMessages.innerHTML += `
                <div class="message message-assistant" id="${loadingId}">
                    <div class="avatar">🐝</div>
                    <div class="loading">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            queryInput.value = '';
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        user_location: userLocation,
                        mode: 'test'
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantText = '';
                let firstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;

                        try {
                            const data = JSON.parse(line.slice(6));
                            allEvents.push(data);

                            if (data.type === 'tool_call') {
                                addToolCall(data);
                            } else if (data.type === 'tool_result') {
                                updateToolResult(data);
                            } else if (data.type === 'data') {
                                addDataCard(data);
                                displayOnMap(data);
                            } else if (data.type === 'chunk') {
                                if (firstChunk) {
                                    document.querySelector(`#${loadingId} .loading`).outerHTML = `<div class="bubble"></div>`;
                                    firstChunk = false;
                                }
                                assistantText += data.text;
                                document.querySelector(`#${loadingId} .bubble`).innerHTML = formatText(assistantText);
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            }

                            rawJson.textContent = JSON.stringify(allEvents, null, 2);
                        } catch (e) {
                            console.error('Parse error:', e);
                        }
                    }
                }

                if (firstChunk) {
                    document.querySelector(`#${loadingId} .loading`).outerHTML = `<div class="bubble">결과를 확인해봐! 👉</div>`;
                }

            } catch (error) {
                console.error('Error:', error);
                document.querySelector(`#${loadingId} .loading`).outerHTML = `<div class="bubble" style="color:#e74c3c">오류: ${error.message}</div>`;
            }

            sendBtn.disabled = false;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 도구 호출 추가
        function addToolCall(data) {
            toolsEmpty.style.display = 'none';
            const id = 'tool-' + Date.now();
            toolsList.innerHTML += `
                <div class="tool-card" id="${id}">
                    <div class="tool-header">
                        <span>🔧</span>
                        <span class="tool-name">${data.name}</span>
                        <span class="tool-status pending">호출 중</span>
                    </div>
                    <div class="tool-body">
                        <div class="tool-label">Arguments</div>
                        <div class="tool-json">${JSON.stringify(data.arguments, null, 2)}</div>
                        <div class="tool-result-section" style="display:none">
                            <div class="tool-label">Result</div>
                            <div class="tool-json tool-result-json"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 도구 결과 업데이트
        function updateToolResult(data) {
            const cards = toolsList.querySelectorAll('.tool-card');
            const lastCard = cards[cards.length - 1];
            if (lastCard) {
                const status = lastCard.querySelector('.tool-status');
                status.textContent = data.result.success ? '성공' : '실패';
                status.className = 'tool-status ' + (data.result.success ? 'success' : 'error');

                const resultSection = lastCard.querySelector('.tool-result-section');
                resultSection.style.display = 'block';
                resultSection.querySelector('.tool-result-json').textContent = JSON.stringify(data.result, null, 2);
            }
        }

        // 데이터 카드 추가
        function addDataCard(data) {
            dataEmpty.style.display = 'none';

            if (data.pois?.length > 0) {
                dataList.innerHTML += createDataList('📍 POI 추천', data.pois, 'title', 'addr1');
            }
            if (data.places?.length > 0) {
                dataList.innerHTML += createDataList('🔍 검색 결과', data.places, 'name', 'formatted_address');
            }
            if (data.routes?.length > 0) {
                dataList.innerHTML += `
                    <div class="data-card">
                        <div class="data-title">🚇 경로 정보 <span class="data-count">${data.routes.length}개</span></div>
                        ${data.routes.map((r, i) => `
                            <div class="poi-item">
                                <div class="poi-name">경로 ${i + 1}</div>
                                <div class="poi-addr">${r.info?.totalTime || '?'}분 · ${r.info?.payment?.toLocaleString() || '?'}원</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            if (data.poi) {
                dataList.innerHTML += `
                    <div class="data-card">
                        <div class="data-title">🎲 랜덤 추천</div>
                        <div class="poi-item" onclick="flyTo(${data.poi.mapx}, ${data.poi.mapy})">
                            <div class="poi-name">${data.poi.title || 'Unknown'}</div>
                            <div class="poi-addr">${data.poi.addr1 || ''}</div>
                        </div>
                    </div>
                `;
            }
            if (data.landmarks?.length > 0) {
                dataList.innerHTML += createDataList('🏛️ 필수 명소', data.landmarks, 'title', 'addr1');
            }
        }

        function createDataList(title, items, nameKey, addrKey) {
            return `
                <div class="data-card">
                    <div class="data-title">${title} <span class="data-count">${items.length}개</span></div>
                    ${items.map(item => `
                        <div class="poi-item" onclick="flyTo(${item.mapx || item.lng}, ${item.mapy || item.lat})">
                            <div class="poi-name">${item[nameKey] || item.name || 'Unknown'}</div>
                            <div class="poi-addr">${item[addrKey] || item.address || ''}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 지도에 표시
        function displayOnMap(data) {
            const bounds = new mapboxgl.LngLatBounds();
            let hasItems = false;

            const displayItems = (items, color, nameKey, addrKey) => {
                items.forEach((item, i) => {
                    const lng = item.mapx || item.lng;
                    const lat = item.mapy || item.lat;
                    if (!lng || !lat) return;

                    hasItems = true;
                    const el = document.createElement('div');
                    el.style.cssText = `width:28px;height:28px;background:${color};border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:11px;cursor:pointer;`;
                    el.textContent = i + 1;

                    const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(`
                        <div style="font-size:13px;color:#333;">
                            <strong>${item[nameKey] || item.name || 'N/A'}</strong><br>
                            ${item[addrKey] || item.address || ''}
                        </div>
                    `);

                    const marker = new mapboxgl.Marker(el)
                        .setLngLat([lng, lat])
                        .setPopup(popup)
                        .addTo(map);

                    poiMarkers.push(marker);
                    bounds.extend([lng, lat]);
                });
            };

            if (data.pois?.length > 0) displayItems(data.pois, '#4a69bd', 'title', 'addr1');
            if (data.places?.length > 0) displayItems(data.places, '#27ae60', 'name', 'formatted_address');
            if (data.landmarks?.length > 0) displayItems(data.landmarks, '#9b59b6', 'title', 'addr1');
            if (data.poi) {
                const poi = data.poi;
                if (poi.mapx && poi.mapy) {
                    hasItems = true;
                    const el = document.createElement('div');
                    el.style.cssText = 'width:32px;height:32px;background:#e74c3c;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:14px;';
                    el.textContent = '🎲';

                    const marker = new mapboxgl.Marker(el)
                        .setLngLat([poi.mapx, poi.mapy])
                        .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(`
                            <div style="font-size:13px;color:#333;">
                                <strong>${poi.title}</strong><br>${poi.addr1 || ''}
                            </div>
                        `))
                        .addTo(map);

                    poiMarkers.push(marker);
                    bounds.extend([poi.mapx, poi.mapy]);
                }
            }

            if (hasItems && !bounds.isEmpty()) {
                map.fitBounds(bounds, { padding: 60 });
            }
        }

        function clearMapMarkers() {
            poiMarkers.forEach(m => m.remove());
            poiMarkers = [];
        }

        function flyTo(lng, lat) {
            if (lng && lat) {
                map.flyTo({ center: [lng, lat], zoom: 15 });
            }
        }

        function formatText(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
